name: Build Android APK
​on:
push:
branches: [ "main", "master" ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Set up JDK 21
uses: actions/setup-java@v4
with:
java-version: '21'
distribution: 'temurin'
​- name: Setup Gradle 9.3.1
uses: gradle/actions/setup-gradle@v3
with:
gradle-version: '9.3.1'
​- name: Prepare Keystore, Google Services & Wrapper
run: |
# 1. إعداد المتغيرات والمفتاح
touch .env
if [ -f ".env.example" ]; then cp .env.example .env; fi
keytool -genkey -v -keystore "${GITHUB_WORKSPACE}/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
​# 2. إنشاء ملف الحماية لخدمات أندرويد
mkdir -p app
cat << 'EOF' > app/google-services.json
{
"project_info": {"project_number": "123","project_id": "dummy","storage_bucket": "dummy"},
"client": [{"client_info": {"mobilesdk_app_id": "1:123:android:dummy","android_client_info": {"package_name": "com.aistudio.learnnumbers"}},"oauth_client": [],"api_key": [{"current_key": "dummy"}],"services": {}}],
"configuration_version": "1"
}
EOF
​# 3. ترقية ملف gradle wrapper الداخلي إلى 9.3.1
if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
sed -i 's/gradle-[0-9.]+-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
fi
​- name: Build Debug APK
env:
KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
STORE_PASS: android
KEY_PASSWORD: android
run: |
if [ -f "./gradlew" ]; then
chmod +x ./gradlew
./gradlew assembleDebug --no-daemon --stacktrace
else
gradle assembleDebug --no-daemon --stacktrace
fi
​- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: NumberLearn-App-APK
path: app/build/outputs/apk//*.apk
